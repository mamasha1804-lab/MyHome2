<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My House — открываем комнаты</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff9ed;color:#354c48;font-family:system-ui,sans-serif;text-align:center}header{padding:18px 12px 8px}header small{color:#71867d;font-size:14px}h1{font-size:clamp(23px,4vw,32px);margin:5px}p{margin:5px 0 12px;color:#69786d}.house{position:relative;width:min(460px,95vw);margin:0 auto 20px;box-shadow:0 12px 42px #754c1820;border-radius:18px;overflow:hidden;background:white}.house>img{width:100%;display:block}.room{position:absolute;background:transparent;border:3px solid transparent;border-radius:8px;cursor:pointer;transition:background .18s,border .18s}.room:focus-visible{outline:3px solid #f2b841;outline-offset:-3px}.room span{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:3px 8px;background:#fffef4e8;border-radius:12px;font-size:11px;color:#594b32;opacity:0;transition:opacity .18s}.room:focus-visible span{opacity:1}dialog{border:0;border-radius:24px;padding:18px;width:min(780px,95vw);background:#fffaf0;color:#354c48;box-shadow:0 20px 90px #0005}dialog::backdrop{background:#293c387c;backdrop-filter:blur(4px)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.top{flex-wrap:wrap;justify-content:flex-end}.top h2{order:2;flex-basis:100%;font-size:clamp(38px,7vw,76px);line-height:1.12;margin:12px 0 0;color:#20696b;text-align:center}.top h2[hidden]{display:none}#translation{font-size:20px}#hint{margin-top:14px}.scene:focus-visible{outline:4px solid #2c929a;outline-offset:3px}button.back{border:0;border-radius:14px;background:#e2efe6;padding:12px 16px;font-size:16px;cursor:pointer;color:#354c48}.scene{display:block;padding:0;cursor:pointer;background:#fff5de;margin:14px auto;border:5px solid #e9cc92;border-radius:18px;overflow:hidden;width:min(100%,640px)}.scene img{display:block;width:100%;max-height:65vh;object-fit:contain;background:#fff5de}dialog[open]{animation:appear .24s ease-out}@keyframes appear{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.stage{position:relative;max-width:1100px;margin:auto}.arrow{position:fixed;right:20px;top:50%;z-index:3;border:3px solid #fff;border-radius:50%;width:68px;height:68px;background:#eab344;color:#604721;box-shadow:0 4px 18px #72501933;font-size:42px;cursor:pointer}.garden{position:relative;width:min(1100px,96vw);margin:auto;border-radius:20px;overflow:hidden}.garden>img{width:100%;display:block}.garden .room{z-index:2}#garden-name{position:absolute;top:3%;left:4%;background:#fff9e8e8;border-radius:18px;padding:8px 20px;font-size:clamp(30px,6vw,72px);margin:0;color:#246d43}.scene{position:relative;max-width:100%;width:100%;border-width:3px}.scene img{max-height:none;width:100%}.hit{position:absolute;border:2px solid transparent;background:transparent;border-radius:12px;cursor:pointer;z-index:2}.hit:focus-visible{outline:3px solid #ffcb47;outline-offset:-3px}#object-word{min-height:34px;font-size:clamp(24px,4vw,36px);font-weight:750;color:#236f78}dialog{width:min(1150px,97vw);max-height:95dvh;overflow:auto}.sound{border:0;border-radius:12px;padding:10px 14px;background:#e2efe6;color:#354c48;font-size:18px;cursor:pointer}.sound[hidden]{display:none}#audio-status{font-size:13px;color:#815529}.garden-back{margin:12px}.scene-base{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;cursor:pointer}header{padding-right:65px;padding-left:20px}@media(max-width:600px){.arrow{width:48px;height:48px;right:5px;font-size:30px}.top h2{font-size:40px}dialog{padding:10px}.house{width:min(420px,88vw)}header p{font-size:14px}}
</style></head><body><header><small>Учимся с Ларисой Коротаевой</small><h1>Добро пожаловать в My House!</h1><p>Нажми на комнату, чтобы заглянуть внутрь</p></header><main class="stage"><button id="to-garden" class="arrow" aria-label="Перейти в сад">→</button><section id="home-page"><div class="house"><img src="assets/house-hq.webp" alt="Дом с шестью комнатами"><div id="rooms"></div></div></section><section id="garden-page" hidden><button class="back garden-back" id="to-home">← К дому</button><p>Нажми на сад, чтобы узнать название. Нажми на домик на дереве, чтобы войти.</p><div class="garden" id="garden-scene"><img src="assets/garden.webp" alt="Сад с домиком на дереве"><button class="scene-base" id="garden-reveal" aria-label="Показать название сада"></button><h2 id="garden-name" hidden>Garden</h2><button id="enter-tree" class="room" aria-label="Открыть домик на дереве" style="left:67%;top:6%;width:28%;height:36%"></button></div></section></main><dialog id="view"><div class="top"><h2 id="name" hidden></h2><button class="sound" id="repeat" hidden aria-label="Повторить название">🔊</button><button class="back" id="close">← Назад</button></div><p id="translation" hidden></p><p id="hint">Нажми на картинку, чтобы увидеть название комнаты</p><div class="scene" id="scene"><img id="inside" alt="Интерьер комнаты"><button class="scene-base" id="reveal" aria-label="Показать название комнаты"></button><div id="objects"></div></div><div id="object-word" aria-live="polite"></div><p id="audio-status" role="status"></p></dialog><script>
const $=id=>document.getElementById(id);
const rooms=[['bedroom','Bedroom','Спальня',4,22.5,46,25],['bathroom','Bathroom','Ванная',51,22.5,46,25],['living-room','Living room','Гостиная',4,48,46,23.5],['hall','Hall','Прихожая',51,48,46,23.5],['kitchen','Kitchen','Кухня',4,72,46,25],['dining-room','Dining room','Столовая',51,72,46,25]];
const items={
'bedroom':[['bed',23,31,54,53],['window',14,7,18,34],['lamp',70,26,10,24],['picture',54,9,16,21],['door',87,3,12,77],['carpet',14,84,72,12],['plant',1,36,11,36],['books',22,46,9,4]],
'bathroom':[['bath',23,47,42,31],['mirror',69,3,18,34],['sink',67,39,19,14],['toilet',80,62,17,31],['window',2,2,14,40],['towel',20,31,4,23],['carpet',26,80,40,15],['plant',20,11,9,17]],
'living-room':[['sofa',21,40,55,37],['table',30,69,37,21],['TV set',84,28,14,27],['lamp',15,16,11,58],['window',52,12,21,25],['picture',29,12,10,19],['carpet',12,91,73,6],['books',51,65,11,8],['plant',8,36,11,40],['cushion',29,48,12,13]],
'hall':[['door',44,28,13,35],['lamp',46,1,12,15],['picture',1,7,13,35],['table',65,55,9,28],['plant',66,40,7,15],['carpet',32,68,35,30]],
'kitchen':[['fridge',0,16,17,74],['cooker',24,48,17,37],['sink',48,45,13,8],['window',42,9,23,32],['table',61,64,38,34],['chair',87,58,10,14],['lamp',81,0,13,22],['cupboard',67,8,18,29],['plant',0,0,16,16]],
'dining-room':[['table',28,54,45,14],['chair',22,46,6,32],['chair',71,46,9,32],['lamp',42,0,16,24],['window',0,1,19,54],['picture',65,14,18,23],['flowers',36,29,18,20],['plant',80,19,19,59],['carpet',18,87,69,11]],
 'tree-house':[['bed',68,37,31,57],['table',34,58,29,13],['chair',26,54,9,32],['chair',58,53,12,33],['window',6,13,23,40],['lamp',55,32,7,18],['books',44,16,7,9],['teddy bear',43,28,8,14],['carpet',21,90,51,8],['picture',66,17,11,16],['flowers',41,48,7,15]]};
let current='',last=null,garden=false,spoken='',voice=null;const dialog=$('view');
function chooseVoice(){if(!('speechSynthesis'in window))return;const list=speechSynthesis.getVoices();voice=list.find(v=>/^en-GB$/i.test(v.lang)&&/Google|Microsoft|Natural/i.test(v.name))||list.find(v=>/^en-GB/i.test(v.lang))||list.find(v=>/^en/i.test(v.lang));}chooseVoice();if('speechSynthesis'in window)speechSynthesis.addEventListener('voiceschanged',chooseVoice);
function speak(text){spoken=text;$('audio-status').textContent='';if(!('speechSynthesis'in window)){$('audio-status').textContent='Озвучка недоступна в этом браузере. Откройте игру в Chrome или Edge.';return}chooseVoice();speechSynthesis.cancel();speechSynthesis.resume();const u=new SpeechSynthesisUtterance(text);u.lang=voice?.lang||'en-GB';if(voice)u.voice=voice;u.rate=.82;u.pitch=1;u.onerror=e=>{if(!['interrupted','canceled'].includes(e.error))$('audio-status').textContent='Не удалось воспроизвести звук. Нажмите 🔊 ещё раз.'};speechSynthesis.speak(u);}
function reveal(){ $('name').hidden=false;$('translation').hidden=false;$('repeat').hidden=false;$('hint').textContent='Нажимай на предметы и слушай их названия';speak($('name').textContent); }
function drawItems(){ $('objects').replaceChildren();for(const [word,x,y,w,h]of(items[current]||[])){const b=document.createElement('button');b.className='hit';b.style.cssText=`left:${x}%;top:${y}%;width:${w}%;height:${h}%`;b.setAttribute('aria-label','Слушать: '+word);b.onclick=e=>{e.stopPropagation();if($('name').hidden){reveal();return}$('object-word').textContent=word;document.querySelectorAll('.hit.active').forEach(el=>el.classList.remove('active'));b.classList.add('active');speak(word)};$('objects').append(b)}}
function openRoom(id,name,ru,origin){current=id;last=origin;$('name').textContent=name;$('translation').textContent=ru;$('name').hidden=true;$('translation').hidden=true;$('repeat').hidden=true;$('hint').textContent='Нажми на картинку, чтобы увидеть название';$('object-word').textContent='';$('audio-status').textContent='';$('inside').src=id==='tree-house'?'assets/tree-house.webp':`assets/${id}-hq.webp`;drawItems();dialog.showModal();dialog.scrollTop=0;}
for(const [id,name,ru,x,y,w,h]of rooms){const b=document.createElement('button');b.className='room';b.style.cssText=`left:${x}%;top:${y}%;width:${w}%;height:${h}%`;b.setAttribute('aria-label',`Открыть: ${ru} — ${name}`);b.onclick=()=>openRoom(id,name,ru,b);$('rooms').append(b);}
$('reveal').onclick=()=>{if($('name').hidden)reveal();else speak($('name').textContent)};$('repeat').onclick=()=>speak(spoken||$('name').textContent);
$('close').onclick=()=>dialog.close();dialog.addEventListener('close',()=>{if('speechSynthesis'in window)speechSynthesis.cancel();last?.focus()});dialog.onclick=e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}};
$('to-garden').onclick=()=>{garden=true;document.querySelector('header h1').textContent='Заглянем в сад!';document.querySelector('header p').textContent='Здесь спрятался домик на дереве';$('home-page').hidden=true;$('to-garden').hidden=true;$('garden-page').hidden=false;$('garden-name').hidden=true;$('garden-reveal').focus()};$('to-home').onclick=()=>{garden=false;document.querySelector('header h1').textContent='Добро пожаловать в My House!';document.querySelector('header p').textContent='Нажми на комнату, чтобы заглянуть внутрь';$('garden-page').hidden=true;$('home-page').hidden=false;$('to-garden').hidden=false;if('speechSynthesis'in window)speechSynthesis.cancel()};$('garden-reveal').onclick=()=>{$('garden-name').hidden=false;speak('Garden')};$('enter-tree').onclick=()=>openRoom('tree-house','tree house','Домик на дереве',$('enter-tree'));
</script></body></html>
